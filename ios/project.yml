# Proyecto de la app nativa de iPhone. XcodeGen genera el .xcodeproj en la compilación (GitHub Actions).
name: Teleprompter
options:
  bundleIdPrefix: com.elpepeperri
  deploymentTarget:
    iOS: "17.0"
targets:
  Teleprompter:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Teleprompter
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "La cámara graba tu video mientras lees el guion."
        NSMicrophoneUsageDescription: "El micrófono graba tu voz (también con micrófonos externos como el Lark)."
        NSSpeechRecognitionUsageDescription: "El reconocimiento de voz hace avanzar el guion mientras hablas. Se hace dentro del iPhone."
        NSPhotoLibraryAddUsageDescription: "Los videos se guardan en Fotos al terminar de grabar."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elpepeperri.teleprompter
        PRODUCT_NAME: Teleprompter
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
